name: Security Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # Mondays at 06:00 UTC

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Audit backend
        working-directory: backend
        run: |
          npm ci
          npm audit --audit-level=moderate || true
      - name: Audit client
        working-directory: client
        run: |
          npm ci
          npm audit --audit-level=moderate || true

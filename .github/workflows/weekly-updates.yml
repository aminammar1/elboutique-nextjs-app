name: Weekly Updates

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1' # Mondays at 05:00 UTC

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          check-latest: false

      - name: Update backend dependencies (minor/patch)
        working-directory: backend
        run: |
          npm update --save --save-dev || true

      - name: Update client dependencies (minor/patch)
        working-directory: client
        run: |
          npm update --save --save-dev || true

      - name: Create PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PERSONAL_TOKEN }}   
          branch: chore/weekly-updates
          commit-message: 'chore: weekly dependency updates'
          title: 'chore: weekly dependency updates'
          body: 'Automated weekly dependency updates (minor/patch).'
          labels: dependencies
